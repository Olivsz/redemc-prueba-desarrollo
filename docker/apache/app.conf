ServerName localhost

# No revelar versión de Apache ni del sistema operativo.
ServerTokens Prod
ServerSignature Off

# Procesos acotados a la memoria del contenedor (1 GB en el trial de Railway).
# Cada proceso ocupa unos 20 MB: con 30 no se superan los ~600 MB. Si llegan más
# pedidos a la vez, esperan en fila en lugar de abrir procesos hasta quedarse sin memoria.
<IfModule mpm_prefork_module>
    MaxRequestWorkers 30
</IfModule>

# Corta las conexiones colgadas, como un cliente que envía su pedido muy lento a propósito.
Timeout 30

<VirtualHost *:${PORT}>
    # Solo /public es accesible desde la web; src/ y vendor/ quedan fuera.
    DocumentRoot /var/www/html/public

    # Un contacto ocupa menos de 1 KB: se rechaza cualquier pedido de más de 16 KB.
    LimitRequestBody 16384

    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes
        Require all granted

        # Toda ruta que no sea un archivo existente la atiende el front controller.
        FallbackResource /index.php

        # El navegador revalida los archivos estáticos en cada visita (si no cambiaron, responde 304),
        # así nadie se queda con CSS o JS viejos después de una nueva publicación.
        <FilesMatch "\.(css|js|svg)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # El navegador recuerda durante un año que el sitio solo se usa por HTTPS (Railway ya redirige el HTTP).
    # Por HTTP, como en local, el navegador ignora este header.
    Header always set Strict-Transport-Security "max-age=31536000"

    # La página no usa cámara, micrófono, ubicación ni otras funciones del dispositivo: quedan bloqueadas.
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    # Solo se cargan scripts, estilos y fuentes del propio sitio y los archivos exactos de los CDN que usa la página.
    # Un script inyectado (XSS) no se ejecutaría. Se nombra cada archivo y no el CDN entero porque desde
    # jsDelivr se puede cargar cualquier paquete de npm, incluso alguno que sirva para saltear esta política.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://code.jquery.com/jquery-3.7.1.min.js https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js; style-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
